[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

ContextTitle=Refresh weather
ContextAction=[!Refresh]

ContextTitle2=Use Celsius
ContextAction2=[!WriteKeyValue Variables TempUnit "celsius" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables UnitLetter "*" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables UseMPH "0" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables WindUnit "km/h" "#CURRENTPATH##CURRENTFILE#"][!Refresh]

ContextTitle3=Use Fahrenheit
ContextAction3=[!WriteKeyValue Variables TempUnit "fahrenheit" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables UnitLetter "+" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables UseMPH "1" "#CURRENTPATH##CURRENTFILE#"][!WriteKeyValue Variables WindUnit "mph" "#CURRENTPATH##CURRENTFILE#"][!Refresh]

ContextTitle4=Change Location...
ContextAction4=[!CommandMeasure MeasureRunBat "Run"]

[Metadata]
Name=RetroWeather
Author= https://github.com/arassp
Information=A retro Rainmeter weather widget using Open Meteo
Version=2.9 (Check Github for any updates)

[Variables]
Latitude=40.7128
Longitude=-74.0060
Location=New York, NY
UpdateSeconds=300
TempUnit=fahrenheit
UnitLetter=+
WeatherFont=Meteocons
UseMPH=1
WindUnit=mph

WeatherURL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,uv_index_max&temperature_unit=#TempUnit#&timezone=auto&forecast_days=4
SunURL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&daily=sunrise,sunset&timezone=auto&forecast_days=1&timeformat=unixtime

Font=Segoe UI

White=255,255,255,255
Black=15,25,35,255
SoftWhite=255,255,255,220
Blue=32,150,215,255
DarkBlue=25,85,125,255
SunColor1=255,225,0,255
SunColor2=255,245,70,230

; MEASURES
[MeasureSun]
Measure=WebParser
URL=#SunURL#
RegExp=(?si).*?"current_weather"\s*:\s*\{.*?"time"\s*:\s*(\d+).*?"daily"\s*:\s*\{.*?"sunrise"\s*:\s*\[\s*(\d+)\s*\].*?"sunset"\s*:\s*\[\s*(\d+)\s*\]
UpdateRate=600
DynamicVariables=1

[MeasureNowUnix]
Measure=WebParser
URL=[MeasureSun]
StringIndex=1

[MeasureSunriseUnix]
Measure=WebParser
URL=[MeasureSun]
StringIndex=2

[MeasureSunsetUnix]
Measure=WebParser
URL=[MeasureSun]
StringIndex=3

[MeasureDarkMode]
Measure=Calc
Formula=(([MeasureNowUnix] < [MeasureSunriseUnix]) || ([MeasureNowUnix] >= [MeasureSunsetUnix])) ? 1 : 0
DynamicVariables=1
IfCondition=MeasureDarkMode = 1
IfTrueAction=[!SetVariable Blue "22,28,45,255"][!SetVariable DarkBlue "10,15,30,255"][!SetVariable Black "235,235,245,255"][!SetVariable SoftWhite "220,220,235,220"][!SetVariable SunColor1 "225,230,240,255"][!SetOption MeterSun Shape2 "Ellipse 8,22,30,30 | Fill Color 185,190,205,80 | StrokeWidth 0"][!SetOption MeterSun Shape3 "Ellipse 58,28,18,18 | Fill Color 170,175,190,70 | StrokeWidth 0"][!SetOption MeterSun Shape4 "Ellipse 34,72,22,22 | Fill Color 175,180,195,65 | StrokeWidth 0"][!SetOption MeterSun Shape5 "Ellipse 82,82,14,14 | Fill Color 165,170,185,60 | StrokeWidth 0"][!SetOption MeterSun Shape6 "Ellipse 92,48,8,8 | Fill Color 150,155,170,60 | StrokeWidth 0"][!SetOption MeterSun Shape7 "Ellipse -6,-6,154,154 | Fill Color 255,255,255,20 | StrokeWidth 0"][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetVariable Blue "32,150,215,255"][!SetVariable DarkBlue "25,85,125,255"][!SetVariable Black "15,25,35,255"][!SetVariable SoftWhite "255,255,255,220"][!SetVariable SunColor1 "255,225,0,255"][!SetOption MeterSun Shape2 ""][!SetOption MeterSun Shape3 ""][!SetOption MeterSun Shape4 ""][!SetOption MeterSun Shape5 ""][!SetOption MeterSun Shape6 ""][!SetOption MeterSun Shape7 ""][!UpdateMeter *][!Redraw]

[MeasureRunBat]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-ExecutionPolicy Bypass -WindowStyle Normal -File "#CURRENTPATH#ChangeLocation.ps1"
State=Show
FinishAction=[!Refresh]

[MeasureWind]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current_weather=true&timezone=auto
RegExp=(?si).*?"windspeed"\s*:\s*([-0-9.]+).*?"winddirection"\s*:\s*([-0-9.]+)
UpdateRate=#UpdateSeconds#
DynamicVariables=1

[MeasureWindSpeedRaw]
Measure=WebParser
URL=[MeasureWind]
StringIndex=1

[MeasureWindSpeed]
Measure=Calc
Formula=(#UseMPH#=1) ? Round([MeasureWindSpeedRaw] * 0.621371) : Round([MeasureWindSpeedRaw])
DynamicVariables=1

[MeasureAQI]
Measure=WebParser
URL=https://air-quality-api.open-meteo.com/v1/air-quality?latitude=#Latitude#&longitude=#Longitude#&current=us_aqi&timezone=auto
RegExp=(?si).*?"us_aqi"\s*:\s*(\d+)
UpdateRate=#UpdateSeconds#
DynamicVariables=1

[MeasureAQIValue]
Measure=WebParser
URL=[MeasureAQI]
StringIndex=1

[MeasureAQIColorR]
Measure=Calc
Formula=([MeasureAQIValue] <= 50) ? 0 : (([MeasureAQIValue] <= 100) ? 255 : (([MeasureAQIValue] <= 150) ? 255 : (([MeasureAQIValue] <= 200) ? 255 : (([MeasureAQIValue] <= 250) ? 143 : 126))))
DynamicVariables=1

[MeasureAQIColorG]
Measure=Calc
Formula=([MeasureAQIValue] <= 50) ? 180 : (([MeasureAQIValue] <= 100) ? 210 : (([MeasureAQIValue] <= 150) ? 126 : (([MeasureAQIValue] <= 200) ? 0 : (([MeasureAQIValue] <= 250) ? 63 : 0))))
DynamicVariables=1

[MeasureAQIColorB]
Measure=Calc
Formula=([MeasureAQIValue] <= 50) ? 0 : (([MeasureAQIValue] <= 100) ? 0 : (([MeasureAQIValue] <= 150) ? 0 : (([MeasureAQIValue] <= 200) ? 0 : (([MeasureAQIValue] <= 250) ? 151 : 35))))
DynamicVariables=1

[MeasureWeather]
Measure=WebParser
URL=#WeatherURL#
RegExp=(?si).*?"current_weather"\s*:\s*\{.*?"temperature"\s*:\s*([-0-9.]+).*?"weathercode"\s*:\s*(\d+).*?"daily"\s*:\s*\{.*?"time"\s*:\s*\[\s*"[^"]+"\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,\s*"([^"]+)".*?"weathercode"\s*:\s*\[\s*\d+\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+).*?"temperature_2m_max"\s*:\s*\[\s*[-0-9.]+\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+).*?"temperature_2m_min"\s*:\s*\[\s*[-0-9.]+\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+).*?"uv_index_max"\s*:\s*\[\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+)\s*,\s*([-0-9.]+)
UpdateRate=#UpdateSeconds#
DynamicVariables=1
FinishAction=[!UpdateMeasureGroup Weather][!UpdateMeasure MeasureSun][!UpdateMeasure MeasureDarkMode][!UpdateMeter *][!Redraw]

[MeasureCurrentTempRaw]
